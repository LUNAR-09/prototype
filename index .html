const V={};let L=[],SH=[];
function cam(tx,ty,tz,yw){const p=.42,sp=S(p),cp=C(p),sy=S(yw),cy=C(yw);V.f=[sy*cp,-sp,cy*cp];V.r=[cy,0,-sy];V.u=[sy*sp,cp,cy*sp];V.p=[tx-V.f[0]*12,ty-V.f[1]*12,tz-V.f[2]*12];V.yw=yw}
